<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventHorizon</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="nav">
        <div class="nav1">
          <div class="logo">
            <img src="logo.png" alt="Logo">
            <a href="index.html" style="text-decoration: none;"><h1>EventHorizon</h1></a>
          </div>
        </div>
        <div class="hamburger" id="hamburger">
          &#9776;
        </div>
        <div class="nav2" id="sideNav">
          <a href="eventwala.html">Events</a>
          <a href="blog.html">Blog</a>
          <a href="Gallery.html">Gallery</a>
          <button>Host an Event</button>
          <div  id="button"><a href="login.html" style="color: white;">Login</a></div>
        </div>
      </div>
      </div>

      <div
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        "
      >
        <div
          id="reg-form"
          style="
            border: 1px solid black;
            width: 500px;
            padding: 20px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
          "
        >
          <form
            method="post"
            action="login.html"
            onsubmit="return Validation()"
            name="myform"
            style="
              display: flex;
              flex-direction: column;
              width: 100%;
              align-items: center;
            "
          >
            <div><h2 style="margin-bottom: 20px">Register</h2></div>
            <div style="width: 80%; margin-bottom: 10px">
              <label>First Name:</label>
              <input type="text" name="name" style="width: 100%" />
            </div>
            <div style="width: 80%; margin-bottom: 10px">
              <label>Last Name:</label>
              <input type="text" name="lname" style="width: 100%" />
            </div>
            <div style="width: 80%; margin-bottom: 10px">
              <label>Email:</label>
              <input type="email" name="email" style="width: 100%" />
            </div>
            <div style="width: 80%; margin-bottom: 10px">
              <label>Password:</label>
              <input type="password" name="pwd" style="width: 100%" />
            </div>
            <div style="width: 80%; margin-bottom: 10px">
              <label>Phone Number:</label>
              <input type="tel" name="mobile" style="width: 100%" />
            </div>
            <div style="width: 80%; margin-bottom: 10px">
              <label>Gender:</label>
              <div style="display: flex; justify-content: center">
                <input type="radio" name="gender" value="male" style="margin-right: 5px" />Male
                <input type="radio" name="gender" value="female" style="margin-right: 5px" />Female
                <input type="radio" name="gender" value="others" style="margin-right: 5px" />Others
              </div>
            </div>
            <div style="width: 80%; margin-bottom: 10px">
              <label>Date of Birth:</label>
              <input type="date" name="dob" style="width: 100%" />
            </div>
            <button type="submit" style="padding:0.5rem 0.7rem;border:none;border-radius: 5px;background-color:#6a0dad;color:#fff">Register</button>
          </form>
        </div>
      </div>
    </div>
    <script>
      function Validation() {
        var n = document.myform.name.value;
        var p = document.myform.pwd.value;
        var m = document.myform.mobile.value;

        if (n == null || n == "") {
          alert("Name field is empty");
          return false;
        } else if (p.length < 6) {
          alert("Length of password is less than 6 characters");
          return false;
        } else if (m != "123456789") {
          alert("Phone number is incorrect");
          return false;
        }
        return true;
      }
    </script>
  </body>
</html>
